<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
    <button
        class="btn btn-outline-secondary mb-3"
        onclick="history.back()">
        ← Back
    </button>
    <h1 "mb-4 text-center" id="destination-title"></h1>
    <div id="destination-detail"></div>
    <h2>Places</h2>
    <button class="btn btn-success mb-3" onclick="togglePlaceForm()">
    Create Place
</button>

<form class="card p-3 mb-4 shadow-sm" id="place-form" style="display:none;">
    <input class="form-control mb-3" type="text" id="name" placeholder="Name" required>
    <input class="form-control mb-3" type="text" id="category" placeholder="Category" required>
    <input class="form-control mb-3" type="number" id="place-budget" placeholder="Budget" required>
    <input class="form-control mb-3" type="text" id="place-status" placeholder="Status" required>
    <input class="form-control mb-3" type="datetime-local" id="arrivalTime" required>
    <input class="form-control mb-3" type="datetime-local" id="departureTime" required>
    <textarea class="form-control mb-3" id="place-notes" placeholder="Place Notes"></textarea>
    <button class="btn btn-primary" type="submit">Add Place</button>
</form>
    <div id="place-list"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="destination.js"></script>
</body>
</html>
