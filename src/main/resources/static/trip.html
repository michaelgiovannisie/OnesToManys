<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container mt-4">
    <button
        class="btn btn-outline-secondary mb-3"
        onclick="history.back()">
        ← Back to Trips
    </button>
    <h1 class="mb-4 text-center" id="trip-title"></h1>
    <div id="trip-detail"></div>
    <h2>Destinations</h2>
    <button class="btn btn-success mb-3" onclick="toggleDestinationForm()">
    Create Destination
</button>

<form class="card p-3 mb-4 shadow-sm" id="destination-form" style="display:none;">
    <input class="form-control mb-3" type="text" id="city" placeholder="City" required>
    <input class="form-control mb-3" type="text" id="country" placeholder="Country" required>
    <input class="form-control mb-3" type="number" id="destination-budget" placeholder="Budget" required>
    <input class="form-control mb-3" type="text" id="destination-status" placeholder="Status" required>
    <input class="form-control mb-3" type="date" id="arrivalDate" required>
    <input class="form-control mb-3" type="date" id="departureDate" required>
    <textarea class="form-control mb-3" id="destination-notes" placeholder="Destination Notes"></textarea>
    <button class="btn btn-primary" type="submit">Add Destination</button>
</form>
    <div id="destination-list"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="trip.js"></script>
</body>
</html>
