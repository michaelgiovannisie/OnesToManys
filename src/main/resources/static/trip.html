<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Detail</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="index.html">← Back to Trips</a>
    <h1 id="trip-title"></h1>
    <div id="trip-detail"></div>
    <h2>Destinations</h2>
    <button onclick="toggleDestinationForm()">
    Create Destination
</button>

<form id="destination-form" style="display:none;">
    <input type="text" id="city" placeholder="City" required>
    <input type="text" id="country" placeholder="Country" required>
    <input type="number" id="destination-budget" placeholder="Budget" required>
    <input type="text" id="destination-status" placeholder="Status" required>
    <input type="date" id="arrivalDate" required>
    <input type="date" id="departureDate" required>
    <textarea id="destination-notes" placeholder="Destination Notes"></textarea>
    <button type="submit">Add Destination</button>
</form>
    <div id="destination-list"></div>
    <script src="trip.js"></script>
</body>
</html>
